#  preserve failures and upload all evidence.
name: Quality
# OpenAI Codex: reuse every blocking gate before publishing a release.
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify release tag matches the package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["RELEASE_TAG"] != f"v{version}":
              raise SystemExit("Release tag must match the package version.")
          PY
      - name: Install test, quality, and documentation tools
        run: python -m pip install -e '.[test,quality,docs]'
      - name: Build source distribution and wheel
        run: python -m build
      - name: Validate installed wheel and example
        run: |
          python -m pip install --no-deps --force-reinstall dist/vaelchi-*.whl
          python -I examples/representative_days.py
      - name: Preserve distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.python-version }}
          path: dist/
      - name: Run all blocking gates
        run: python tools/quality.py all --output quality/reports/ci
      - name: Upload coverage to Codecov
        if: ${{ !cancelled() && hashFiles('quality/reports/ci/coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: quality/reports/ci/coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
      - name: Preserve gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-${{ matrix.python-version }}
          path: quality/reports/
