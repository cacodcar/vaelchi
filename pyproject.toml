[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vaelchi"
version = "0.2.0"
authors = [
  { name="Rahul Kakodkar", email="cacodcar@gmail.com" },
]
maintainers = [
  { name="Rahul Kakodkar", email="cacodcar@gmail.com" },
]
description = "Python package for time-series analysis"
requires-python = ">=3.12"
# OpenAI Codex: use one light-mode logo in PyPI's project description.
readme = "README-PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["representative days", "modeling", "energy systems", "clustering"]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

dependencies = ["pandas", "numpy", "scipy", "scikit-learn"]
[project.optional-dependencies]
#  shared test and quality toolchain.
#  complete test tooling.
test = ["coverage", "pytest", "pytest-cov", "hypothesis", "flake8", "radon", "ruff==0.16.9", "tox"]
quality = ["radon", "ruff==0.16.9", "mypy", "tox", "build", "setuptools", "wheel", "packaging", "pandas-stubs==3.0.5.260914", "scipy-stubs==1.18.1.1"]
docs = [
    "sphinx>=8.2,<9",
    "sphinx-book-theme>=1.4,<1.5",
    "myst-nb",
    "sphinx-copybutton",
    "sphinx-togglebutton",
    "sphinx-design",
    "sphinx-tabs",
]

[project.urls]
Homepage = "https://github.com/cacodcar/vaelchi"
Documentation = "https://vaelchi.readthedocs.io/en/latest/index.html"
Issues = "https://github.com/cacodcar/vaelchi/issues"


#  resolve the public package in local tests.
[tool.pytest.ini_options]
pythonpath = ["src"]

#  independent measured coverage floors.
[tool.research-quality]
package = "vaelchi"
statement-floor = 90
branch-floor = 88
local-dependencies = []

#  check annotated and unannotated bodies.
[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
explicit_package_bases = true
namespace_packages = true
mypy_path = ["$MYPY_CONFIG_FILE_DIR/src", "$MYPY_CONFIG_FILE_DIR/tools"]

# scikit-learn lacks a typing marker. Analyze its actual source instead of
# ignoring missing imports, matching Gana's policy for unmarked dependencies.
[[tool.mypy.overrides]]
module = ["sklearn", "sklearn.*"]
follow_untyped_imports = true

#  ship only the Vaelchi source namespace.
[tool.setuptools.packages.find]
where = ["src"]
include = ["vaelchi", "vaelchi.*"]
